[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/senthilsweb/datagov"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
schemars = "0.8"
sha2 = "0.10"
csv = "1"
parquet = { version = "59", default-features = false, features = ["snap", "json"] }
comfy-table = "7"
datafusion = "54"
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex = "1"
sqlglot-rust = "0.10"

# dev dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"
jsonschema = "0.49"

datagov-core = { path = "crates/datagov-core" }
datagov-data = { path = "crates/datagov-data" }
datagov-sql = { path = "crates/datagov-sql" }
datagov-pii = { path = "crates/datagov-pii" }
datagov-report = { path = "crates/datagov-report" }
