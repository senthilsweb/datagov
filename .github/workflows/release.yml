name: Release

# Tag-driven cross-platform release per PRD §29 and the
# release-distribution spec delta: pushing v* builds the binary matrix,
# generates an SPDX SBOM and SHA-256 checksums, and publishes a GitHub
# Release. darwin-arm64 and linux-x86_64 are required targets for 0.1;
# the rest of the matrix is best-effort (fail-fast disabled).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: datagov

jobs:
  build-required:
    name: Build ${{ matrix.artifact }} (required)
    runs-on: ${{ matrix.runner }}
    # GitHub collapses a matrix job's result into one worst-case value
    # for needs.<job>.result — a downstream job can't tell "a required
    # leg failed" from "only a best-effort leg failed" if they share one
    # matrix (confirmed via GitHub Actions docs/community discussion,
    # 2026-07-26, after continue-on-error alone caused the release job
    # to be skipped rather than proceed on rc.3). Required and
    # best-effort targets are therefore separate jobs: this one gates
    # the release normally (no continue-on-error); build-optional below
    # never blocks it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: datagov-darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - artifact: datagov-linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p datagov-cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          cp "$SRC" "dist/${{ matrix.artifact }}"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  build-optional:
    name: Build ${{ matrix.artifact }} (best-effort)
    runs-on: ${{ matrix.runner }}
    # Best-effort per PRD §29 — continue-on-error so a slow/unavailable
    # runner (observed: macos-13 queued 50+ min with no capacity twice,
    # 2026-07-26) can't block the release; timeout-minutes bounds the
    # wait once a runner IS assigned. Kept out of build-required's
    # matrix so a failure/timeout here can never cause the release job
    # to be skipped (see the note on build-required above).
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: datagov-darwin-x86_64
            # Cross-compiled from the same arm64 runner as datagov-darwin-arm64,
            # not a native macos-13 (Intel) runner — that pool queued with no
            # capacity for 50+ minutes on two consecutive releases (2026-07-26).
            # Xcode's toolchain on Apple Silicon runners supports both Apple
            # targets natively, so this needs no separate machine.
            runner: macos-14
            target: x86_64-apple-darwin
          - artifact: datagov-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - artifact: datagov-windows-x86_64.exe
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p datagov-cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          cp "$SRC" "dist/${{ matrix.artifact }}"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate SPDX SBOM
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format spdx_json_2_3 > datagov.spdx.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: datagov.spdx.json

  release:
    name: Publish GitHub Release
    needs: [build-required, build-optional, sbom]
    # !cancelled() overrides the default "only run if every needs job
    # succeeded" gating — without it, build-optional's expected
    # failures (best-effort targets) would skip this job entirely, the
    # exact bug hit on rc.3. build-optional's result is deliberately
    # never checked below: only the required build and the SBOM must
    # have actually succeeded for a release to be published.
    if: ${{ !cancelled() && needs.build-required.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Detect pre-release tag
        id: semver
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.semver.outputs.prerelease }}
