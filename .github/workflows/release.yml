name: Release

# Tag-driven cross-platform release per PRD §29 and the
# release-distribution spec delta: pushing v* builds the binary matrix,
# generates an SPDX SBOM and SHA-256 checksums, and publishes a GitHub
# Release. darwin-arm64 and linux-x86_64 are required targets for 0.1;
# the rest of the matrix is best-effort (fail-fast disabled).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: datagov

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    # required targets (release-distribution spec: darwin-arm64 +
    # linux-x86_64) must succeed for the release to proceed; the rest
    # are best-effort per PRD §29 — continue-on-error so a slow/
    # unavailable runner (observed: macos-13 queued 50+ min with no
    # capacity, 2026-07-26) can't block the whole release indefinitely.
    # timeout-minutes bounds every leg, required or not, so a stuck
    # queue fails loudly within 20 min instead of hanging forever.
    timeout-minutes: 20
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: datagov-darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            required: true
          - artifact: datagov-darwin-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            required: false
          - artifact: datagov-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            required: false
          - artifact: datagov-linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            required: true
          - artifact: datagov-windows-x86_64.exe
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            required: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p datagov-cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          [ -f "${SRC}.exe" ] && SRC="${SRC}.exe"
          cp "$SRC" "dist/${{ matrix.artifact }}"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate SPDX SBOM
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format spdx_json_2_3 > datagov.spdx.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: datagov.spdx.json

  release:
    name: Publish GitHub Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Detect pre-release tag
        id: semver
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.semver.outputs.prerelease }}
